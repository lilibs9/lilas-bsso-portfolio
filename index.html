<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Lilas Bsso - Frontend Developer Portfolio">
    <title>Lilas Bsso - Portfolio</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
        }
        
        /* Optimized gradient background */
        .gradient-bg {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            position: relative;
        }
        
        /* Simplified animations */
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-15px); }
        }
        
        .float {
            animation: float 3s ease-in-out infinite;
        }
        
        /* Glass effect */
        .glass {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }
        
        /* Skill progress bar */
        .skill-bar {
            height: 8px;
            background: #E5E7EB;
            border-radius: 4px;
            overflow: hidden;
        }
        
        .skill-progress {
            height: 100%;
            background: linear-gradient(90deg, #4F46E5 0%, #FBBF24 100%);
            transition: width 1.5s ease-out;
        }
        
        /* Smooth scrolling */
        html {
            scroll-behavior: smooth;
        }
        
        /* Loading optimization */
        img {
            max-width: 100%;
            height: auto;
        }
        
        /* Focus styles for accessibility */
        *:focus-visible {
            outline: 2px solid #4F46E5;
            outline-offset: 2px;
        }
        
        /* Mobile menu transition */
        .mobile-menu {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease-out;
        }
        
        .mobile-menu.open {
            max-height: 300px;
        }
        
        /* Optimized scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        
        ::-webkit-scrollbar-track {
            background: #F3F4F6;
        }
        
        ::-webkit-scrollbar-thumb {
            background: #4F46E5;
            border-radius: 4px;
        }
        
        /* Card hover effect */
        .card {
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        
        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
        }
        
        /* Button styles */
        .btn {
            transition: all 0.2s ease;
        }
        
        .btn:active {
            transform: scale(0.98);
        }
        
        /* Spinner */
        .spinner {
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            width: 20px;
            height: 20px;
            animation: spin 0.8s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        /* Responsive typography */
        @media (max-width: 640px) {
            html {
                font-size: 14px;
            }
        }
    </style>
</head>
<body class="bg-gray-50">
    <div id="root"></div>
    
    <script type="text/babel">
        const { useState, useEffect, useRef, useCallback } = React;

        // Navigation Component
        const Navigation = () => {
            const [isScrolled, setIsScrolled] = useState(false);
            const [isMobileMenuOpen, setIsMobileMenuOpen] = useState(false);
            
            useEffect(() => {
                let ticking = false;
                const handleScroll = () => {
                    if (!ticking) {
                        window.requestAnimationFrame(() => {
                            setIsScrolled(window.scrollY > 50);
                            ticking = false;
                        });
                        ticking = true;
                    }
                };
                window.addEventListener('scroll', handleScroll, { passive: true });
                return () => window.removeEventListener('scroll', handleScroll);
            }, []);
            
            const scrollToSection = useCallback((id) => {
                const element = document.getElementById(id);
                element?.scrollIntoView({ behavior: 'smooth', block: 'start' });
                setIsMobileMenuOpen(false);
            }, []);
            
            return (
                <nav className={`fixed top-0 w-full z-50 transition-all duration-300 ${
                    isScrolled ? 'glass shadow-md' : 'bg-transparent'
                }`}>
                    <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                        <div className="flex justify-between items-center h-16">
                            <button 
                                onClick={() => scrollToSection('home')}
                                className="text-xl sm:text-2xl font-bold text-indigo-600 hover:text-indigo-700 transition-colors"
                            >
                                LB Portfolio
                            </button>
                            
                            {/* Desktop Menu */}
                            <div className="hidden md:flex space-x-6 lg:space-x-8">
                                {['Home', 'About', 'Projects', 'Contact'].map(item => (
                                    <button
                                        key={item}
                                        onClick={() => scrollToSection(item.toLowerCase())}
                                        className="text-gray-700 hover:text-indigo-600 transition-colors font-medium"
                                    >
                                        {item}
                                    </button>
                                ))}
                            </div>
                            
                            {/* Mobile Menu Button */}
                            <button
                                className="md:hidden p-2 rounded-lg hover:bg-gray-100 transition-colors"
                                onClick={() => setIsMobileMenuOpen(!isMobileMenuOpen)}
                                aria-label="Toggle menu"
                                aria-expanded={isMobileMenuOpen}
                            >
                                <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    {isMobileMenuOpen ? (
                                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M6 18L18 6M6 6l12 12" />
                                    ) : (
                                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 6h16M4 12h16M4 18h16" />
                                    )}
                                </svg>
                            </button>
                        </div>
                    </div>
                    
                    {/* Mobile Menu */}
                    <div className={`mobile-menu md:hidden glass ${isMobileMenuOpen ? 'open' : ''}`}>
                        <div className="px-4 py-3 space-y-2">
                            {['Home', 'About', 'Projects', 'Contact'].map(item => (
                                <button
                                    key={item}
                                    onClick={() => scrollToSection(item.toLowerCase())}
                                    className="block w-full text-left px-3 py-2 text-gray-700 hover:text-indigo-600 hover:bg-gray-50 rounded-lg transition-colors"
                                >
                                    {item}
                                </button>
                            ))}
                        </div>
                    </div>
                </nav>
            );
        };
        
        // Hero Section Component
        const Hero = () => {
            const [roleIndex, setRoleIndex] = useState(0);
            const roles = ['Frontend Developer', 'UI/UX Designer', 'JavaScript Interactions'];
            
            useEffect(() => {
                const interval = setInterval(() => {
                    setRoleIndex((prev) => (prev + 1) % roles.length);
                }, 3000);
                return () => clearInterval(interval);
            }, []);
            
            return (
                <section id="home" className="min-h-screen gradient-bg flex items-center justify-center px-4">
                    <div className="text-center max-w-4xl mx-auto">
                        <div className="mb-6 sm:mb-8">
                            <div className="w-24 h-24 sm:w-32 sm:h-32 mx-auto rounded-full ring-4 ring-white ring-offset-4 ring-offset-indigo-500 bg-gradient-to-br from-indigo-600 to-amber-400 flex items-center justify-center text-white text-3xl sm:text-5xl font-bold shadow-2xl float">
                                LB
                            </div>
                        </div>
                        
                        <h1 className="text-4xl sm:text-5xl md:text-6xl lg:text-7xl font-bold text-white mb-4 sm:mb-6">
                            Hi, I'm <span className="text-amber-400">Lilas Bsso</span>
                        </h1>
                        
                        <div className="h-12 sm:h-16 mb-6 sm:mb-8">
                            <p className="text-lg sm:text-xl md:text-2xl text-white opacity-90 transition-opacity duration-500">
                                {roles[roleIndex]}
                            </p>
                        </div>
                        
                        <button
                            onClick={() => document.getElementById('projects')?.scrollIntoView({ behavior: 'smooth' })}
                            className="btn px-6 sm:px-8 py-3 sm:py-4 bg-white text-indigo-600 rounded-lg font-semibold shadow-lg hover:shadow-xl hover:bg-gray-50"
                        >
                            View My Work
                        </button>
                    </div>
                </section>
            );
        };
        
        // Skill Component
        const Skill = ({ name, percentage }) => {
            const [width, setWidth] = useState(0);
            const [isVisible, setIsVisible] = useState(false);
            const ref = useRef(null);
            
            useEffect(() => {
                const observer = new IntersectionObserver(
                    ([entry]) => {
                        if (entry.isIntersecting && !isVisible) {
                            setIsVisible(true);
                            setTimeout(() => setWidth(percentage), 100);
                        }
                    },
                    { threshold: 0.3 }
                );
                
                if (ref.current) observer.observe(ref.current);
                return () => observer.disconnect();
            }, [percentage, isVisible]);
            
            return (
                <div ref={ref} className="mb-4">
                    <div className="flex justify-between mb-2">
                        <span className="font-medium text-gray-700">{name}</span>
                        <span className="text-indigo-600 font-semibold">{percentage}%</span>
                    </div>
                    <div className="skill-bar">
                        <div 
                            className="skill-progress"
                            style={{ width: `${width}%` }}
                        />
                    </div>
                </div>
            );
        };
        
        // About Section Component
        const About = () => {
            const skills = [
                { name: 'HTML', percentage: 100 },
                { name: 'CSS', percentage: 90 },
                { name: 'JavaScript', percentage: 80 }
            ];
            
            return (
                <section id="about" className="py-16 sm:py-20 md:py-24 bg-white">
                    <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                        <h2 className="text-3xl sm:text-4xl md:text-5xl font-bold text-gray-900 text-center mb-10 sm:mb-16">
                            About Me
                        </h2>
                        
                        <div className="grid md:grid-cols-2 gap-8 lg:gap-12 items-center">
                            <div>
                                <div className="w-64 h-64 sm:w-80 sm:h-80 mx-auto rounded-2xl bg-gradient-to-br from-indigo-400 to-purple-600 flex items-center justify-center text-white text-7xl sm:text-9xl font-bold shadow-xl">
                                    LB
                                </div>
                            </div>
                            
                            <div className="space-y-6">
                                <div className="prose prose-lg">
                                    <p className="text-lg text-gray-700 leading-relaxed">
                                        I craft clean, responsive websites using <span className="font-semibold text-indigo-600">HTML</span>, <span className="font-semibold text-indigo-600">CSS</span>, and <span className="font-semibold text-indigo-600">JavaScript</span>, turning ideas into fully functional digital experiences.
                                    </p>
                                    
                                    <p className="text-lg text-gray-700 leading-relaxed">
                                        Every line of code I write is focused on <span className="font-semibold text-purple-600">usability</span>, <span className="font-semibold text-purple-600">performance</span>, and <span className="font-semibold text-purple-600">visual impact</span> — so your project doesn't just look good, it works flawlessly.
                                    </p>
                                    
                                    <p className="text-lg text-gray-700 leading-relaxed">
                                        Whether it's a sleek landing page or a dynamic interface, I bring concepts to life <span className="font-semibold text-amber-600">efficiently</span> and <span className="font-semibold text-amber-600">creatively</span>.
                                    </p>
                                </div>
                                
                                <div className="pt-4">
                                    <h3 className="text-xl font-bold text-gray-900 mb-4">Technical Skills</h3>
                                    <div className="space-y-3 sm:space-y-4">
                                        {skills.map(skill => (
                                            <Skill key={skill.name} {...skill} />
                                        ))}
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </section>
            );
        };
        
        // Project Card Component
        const ProjectCard = ({ project }) => {
            return (
                <div className="card bg-white rounded-xl overflow-hidden shadow-lg">
                    <div className={`aspect-video w-full bg-gradient-to-br ${project.gradient} flex items-center justify-center text-white text-5xl sm:text-6xl`}>
                        {project.icon}
                    </div>
                    
                    <div className="p-4 sm:p-6">
                        <h3 className="text-xl sm:text-2xl font-bold text-gray-900 mb-2 sm:mb-3">
                            {project.title}
                        </h3>
                        <p className="text-sm sm:text-base text-gray-600 mb-3 sm:mb-4 leading-relaxed">
                            {project.description}
                        </p>
                        
                        <div className="flex flex-wrap gap-2 mb-4">
                            {project.tech.map(tech => (
                                <span
                                    key={tech}
                                    className="px-2 sm:px-3 py-1 bg-indigo-50 text-indigo-600 rounded-full text-xs font-medium"
                                >
                                    {tech}
                                </span>
                            ))}
                        </div>
                        
                        <div className="grid grid-cols-2 gap-3">
                            <a 
                                href={project.liveUrl} 
                                target="_blank" 
                                rel="noopener noreferrer"
                                className="btn bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg font-medium text-sm sm:text-base text-center"
                            >
                                Live Demo
                            </a>
                            <a 
                                href={project.githubUrl}
                                target="_blank" 
                                rel="noopener noreferrer"
                                className="btn border-2 border-indigo-600 text-indigo-600 hover:bg-indigo-50 px-4 py-2 rounded-lg font-medium text-sm sm:text-base text-center"
                            >
                                GitHub
                            </a>
                        </div>
                    </div>
                </div>
            );
        };
        
        // Projects Section Component
        const Projects = () => {
            const projects = [
                {
                    title: 'Personal Portfolio',
                    description: 'Responsive portfolio website with editorial magazine aesthetic, smooth animations, and dark theme with elegant typography.',
                    tech: ['HTML', 'CSS', 'JavaScript'],
                    gradient: 'from-slate-700 to-orange-500',
                    icon: '💼',
                    liveUrl: 'portfolio.html',
                    githubUrl: '#'
                },
                {
                    title: 'TaskFlow - To-Do App',
                    description: 'Interactive task management app with playful design, local storage, category filters, and real-time statistics.',
                    tech: ['HTML', 'CSS', 'JavaScript'],
                    gradient: 'from-indigo-500 to-pink-500',
                    icon: '✓',
                    liveUrl: 'https://lilibs9.github.io/taskflow-todo-app/',
                    githubUrl: 'https://github.com/lilibs9/taskflow-todo-app'
                },
                {
                    title: 'Nexus AI Landing',
                    description: 'Modern SaaS landing page with tech-forward aesthetic, gradient backgrounds, and scroll-triggered animations.',
                    tech: ['HTML', 'CSS', 'JavaScript'],
                    gradient: 'from-blue-600 to-purple-600',
                    icon: '🚀',
                    liveUrl: 'landing-page.html',
                    githubUrl: '#'
                },
                {
                    title: 'Luxe - Product Gallery',
                    description: 'E-commerce product gallery with luxury retail aesthetic, filter/sort features, and shopping cart functionality.',
                    tech: ['HTML', 'CSS', 'JavaScript'],
                    gradient: 'from-amber-600 to-gray-800',
                    icon: '⌚',
                    liveUrl: 'ecommerce-gallery.html',
                    githubUrl: '#'
                },
                {
                    title: 'Interactive Pricing',
                    description: 'SaaS pricing table with modern design, billing toggle, FAQ accordion, and smooth hover effects.',
                    tech: ['HTML', 'CSS', 'JavaScript'],
                    gradient: 'from-indigo-600 to-violet-600',
                    icon: '💎',
                    liveUrl: 'pricing-table.html',
                    githubUrl: '#'
                },
                {
                    title: 'Event Countdown',
                    description: 'Customizable countdown timer with dramatic aesthetic, emoji picker, confetti effects, and social sharing.',
                    tech: ['HTML', 'CSS', 'JavaScript'],
                    gradient: 'from-pink-500 to-purple-700',
                    icon: '⏱️',
                    liveUrl: 'countdown-timer.html',
                    githubUrl: '#'
                }
            ];
            
            return (
                <section id="projects" className="py-16 sm:py-20 md:py-24 bg-gray-50">
                    <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                        <h2 className="text-3xl sm:text-4xl md:text-5xl font-bold text-gray-900 text-center mb-10 sm:mb-16">
                            Featured Projects
                        </h2>
                        
                        <div className="grid sm:grid-cols-2 lg:grid-cols-3 gap-6 sm:gap-8">
                            {projects.map(project => (
                                <ProjectCard key={project.title} project={project} />
                            ))}
                        </div>
                    </div>
                </section>
            );
        };
        
        // Contact Form Component
        const Contact = () => {
            const [formData, setFormData] = useState({
                name: '',
                email: '',
                message: ''
            });
            const [isSubmitting, setIsSubmitting] = useState(false);
            const [submitStatus, setSubmitStatus] = useState(null);

            const handleSubmit = async (e) => {
                e.preventDefault();
                setIsSubmitting(true);

                try {
                    const response = await fetch('https://formsubmit.co/lilas.it.services@gmail.com', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Accept': 'application/json'
                        },
                        body: JSON.stringify(formData)
                    });

                    if (!response.ok) throw new Error();

                    setSubmitStatus('success');
                    setFormData({ name: '', email: '', message: '' });
                    setTimeout(() => setSubmitStatus(null), 5000);
                } catch {
                    setSubmitStatus('error');
                    alert('Failed to send message. Please try again.');
                } finally {
                    setIsSubmitting(false);
                }
            };
            
            return (
                <section id="contact" className="py-16 sm:py-20 md:py-24 bg-white">
                    <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                        <h2 className="text-3xl sm:text-4xl md:text-5xl font-bold text-gray-900 text-center mb-10 sm:mb-16">
                            Get In Touch
                        </h2>
                        
                        <div className="max-w-2xl mx-auto">
                            <div className="glass rounded-xl shadow-xl p-6 sm:p-8 md:p-12">
                                <form onSubmit={handleSubmit}>
                                    <div className="mb-5">
                                        <label htmlFor="name" className="block text-sm font-medium text-gray-700 mb-2">
                                            Your Name
                                        </label>
                                        <input
                                            type="text"
                                            id="name"
                                            value={formData.name}
                                            onChange={(e) => setFormData({...formData, name: e.target.value})}
                                            required
                                            className="w-full px-4 py-3 border-2 border-gray-200 rounded-lg focus:border-indigo-600 focus:outline-none transition-colors"
                                        />
                                    </div>
                                    
                                    <div className="mb-5">
                                        <label htmlFor="email" className="block text-sm font-medium text-gray-700 mb-2">
                                            Email Address
                                        </label>
                                        <input
                                            type="email"
                                            id="email"
                                            value={formData.email}
                                            onChange={(e) => setFormData({...formData, email: e.target.value})}
                                            required
                                            className="w-full px-4 py-3 border-2 border-gray-200 rounded-lg focus:border-indigo-600 focus:outline-none transition-colors"
                                        />
                                    </div>
                                    
                                    <div className="mb-6">
                                        <label htmlFor="message" className="block text-sm font-medium text-gray-700 mb-2">
                                            Your Message
                                        </label>
                                        <textarea
                                            id="message"
                                            rows="5"
                                            value={formData.message}
                                            onChange={(e) => setFormData({...formData, message: e.target.value})}
                                            required
                                            className="w-full px-4 py-3 border-2 border-gray-200 rounded-lg focus:border-indigo-600 focus:outline-none transition-colors resize-none"
                                        ></textarea>
                                    </div>
                                    
                                    <button
                                        type="submit"
                                        disabled={isSubmitting}
                                        className="btn w-full bg-indigo-600 hover:bg-indigo-700 text-white py-3 sm:py-4 rounded-lg font-semibold shadow-lg disabled:opacity-70 disabled:cursor-not-allowed flex items-center justify-center"
                                    >
                                        {isSubmitting ? (
                                            <>
                                                <div className="spinner mr-3"></div>
                                                Sending...
                                            </>
                                        ) : (
                                            'Send Message'
                                        )}
                                    </button>
                                    
                                    {submitStatus === 'success' && (
                                        <div className="mt-4 p-4 bg-emerald-50 border border-emerald-200 rounded-lg text-emerald-700 text-center text-sm sm:text-base">
                                            ✓ Message sent successfully! I'll get back to you soon.
                                        </div>
                                    )}
                                </form>
                            </div>
                        </div>
                    </div>
                </section>
            );
        };
        
        // Footer Component
        const Footer = () => {
            const socialLinks = [
                { icon: '💼', label: 'LinkedIn', href: '#' },
                { icon: '🐙', label: 'GitHub', href: '#' },
                { icon: '✉️', label: 'Email', href: 'mailto:lilas.it.services@gmail.com' }
            ];
            
            const scrollToSection = (id) => {
                document.getElementById(id)?.scrollIntoView({ behavior: 'smooth' });
            };
            
            return (
                <footer className="bg-gray-900 text-gray-300 py-10 sm:py-12">
                    <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                        <div className="grid sm:grid-cols-2 lg:grid-cols-3 gap-8 mb-8">
                            <div>
                                <h3 className="text-xl sm:text-2xl font-bold text-white mb-4">
                                    LB Portfolio
                                </h3>
                                <p className="text-sm sm:text-base text-gray-400">
                                    Building beautiful web experiences with modern technologies.
                                </p>
                            </div>
                            
                            <div>
                                <h4 className="text-base sm:text-lg font-semibold text-white mb-4">
                                    Quick Links
                                </h4>
                                <div className="space-y-2 text-sm sm:text-base">
                                    {['Home', 'About', 'Projects', 'Contact'].map(link => (
                                        <button
                                            key={link}
                                            onClick={() => scrollToSection(link.toLowerCase())}
                                            className="block hover:text-indigo-400 transition-colors"
                                        >
                                            {link}
                                        </button>
                                    ))}
                                </div>
                            </div>
                            
                            <div className="sm:col-span-2 lg:col-span-1">
                                <h4 className="text-base sm:text-lg font-semibold text-white mb-4">
                                    Connect
                                </h4>
                                <div className="flex gap-3 sm:gap-4">
                                    {socialLinks.map(social => (
                                        <a
                                            key={social.label}
                                            href={social.href}
                                            className="w-10 h-10 sm:w-12 sm:h-12 flex items-center justify-center rounded-full bg-gray-800 hover:bg-indigo-600 transition-colors text-lg sm:text-xl"
                                            aria-label={social.label}
                                        >
                                            {social.icon}
                                        </a>
                                    ))}
                                </div>
                            </div>
                        </div>
                        
                        <div className="border-t border-gray-800 pt-6 sm:pt-8 text-center text-sm sm:text-base text-gray-400">
                            <p>&copy; 2026 Lilas Bsso. All rights reserved.</p>
                        </div>
                    </div>
                </footer>
            );
        };
        
        // Main App Component
        const App = () => {
            return (
                <>
                    <Navigation />
                    <Hero />
                    <About />
                    <Projects />
                    <Contact />
                    <Footer />
                </>
            );
        };
        
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
